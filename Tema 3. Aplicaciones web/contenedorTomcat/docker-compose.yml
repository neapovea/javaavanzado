services:
  tomcat:
    image: tomcat:10.1.60-jdk17-temurin-resolute
    container_name: mi-tomcat
    ports:
      - "8080:8080"
    volumes:
      - ./conf/tomcat-users.xml:/usr/local/tomcat/conf/tomcat-users.xml
      - ./webapps/manager/META-INF/context.xml:/usr/local/tomcat/webapps/manager/META-INF/context.xml
      - ./webapps/host-manager/META-INF/context.xml:/usr/local/tomcat/webapps/host-manager/META-INF/context.xml
      - ./webapps/host-manager/WEB-INF/context.xml:/usr/local/tomcat/webapps/host-manager/WEB-INF/context.xml      
      - ./webapps/examples/META-INF/context.xml:/usr/local/tomcat/webapps/examples/META-INF/context.xml
      - ./webapps/docs/META-INF/context.xml:/usr/local/tomcat/webapps/docs/META-INF/context.xml
    command: >
      sh -c "cp -rn /usr/local/tomcat/webapps.dist/* /usr/local/tomcat/webapps/ && catalina.sh run"